<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Trebuchet MS", "Segoe UI", sans-serif; background: #1d2b3a; color: #fff6e0; }
  header { padding: 12px 18px 6px; }
  h1 { margin: 0; font-size: 28px; }
  header p { margin: 4px 0 0; font-size: 17px; color: #e7d8b4; }
  .coats { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; font-size: 15px; }
  .pill { padding: 4px 12px; border-radius: 999px; font-weight: bold; color: #2b1a0e; border: 2px solid #2b1a0e; }
  .p1 { background: #ffffff; } .p2 { background: #ffd54f; } .p3 { background: #c79a5a; } .p4 { background: #f4e3bf; }
  .arrow { color: #f0c85a; font-size: 20px; }
  .wrap { padding: 8px 14px 20px; max-width: 1760px; margin: 0 auto; }
  .stage { background: #0f1720; border: 5px solid #3b2a1a; border-radius: 16px; overflow: hidden; }
  svg { display: block; width: 100%; height: auto; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; background: #2b1d12; }
  button { font: inherit; font-size: 16px; padding: 8px 14px; border-radius: 10px; border: 3px solid #f0d9a8; background: #4a3220; color: #fff6e0; cursor: pointer; }
  button.on { background: #f0c85a; color: #2b1a0e; font-weight: bold; }
  button.go { border-color: #7fd37f; }
  .sep { width: 12px; }
  .info { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; padding: 12px; background: #fff8e6; color: #2b1a0e; border-top: 5px solid #3b2a1a; }
  @media (max-width: 900px) { .info { grid-template-columns: 1fr; } }
  .step small { display: block; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: #8a5a32; }
  .step h2 { margin: 2px 0 6px; font-size: 26px; }
  .step p { margin: 0; font-size: 21px; line-height: 1.35; }
  .bar2 { height: 10px; background: #e2d3b0; border-radius: 6px; margin-top: 10px; overflow: hidden; }
  .bar2 i { display: block; height: 100%; width: 0; background: #e0a526; transition: width .4s; }
  .card { background: #f1e5c8; border-radius: 12px; padding: 10px 14px; }
  .card h3 { margin: 0 0 4px; font-size: 20px; }
  .card p { margin: 3px 0; font-size: 16px; }
  .file { font-family: Consolas, monospace; font-size: 13px; background: #fff8e6; padding: 3px 6px; border-radius: 6px; word-break: break-all; display: inline-block; }

  .obj { cursor: pointer; }
  .obj.lit { animation: pulse 1s ease-in-out infinite alternate; }
  @keyframes pulse { from { filter: drop-shadow(0 0 4px #ffe066) drop-shadow(0 0 10px #ffc107); } to { filter: drop-shadow(0 0 10px #fff3a0) drop-shadow(0 0 24px #ffb300); } }
  .nm { font: 700 20px "Trebuchet MS", sans-serif; fill: #2b1a0e; paint-order: stroke; stroke: #fff8e6; stroke-width: 5px; stroke-linejoin: round; }
  .fl { font: 13px Consolas, monospace; fill: #4a3220; paint-order: stroke; stroke: #fff8e6; stroke-width: 4px; stroke-linejoin: round; }
  .nm.w { fill: #fff8e6; stroke: #1e140b; } .fl.w { fill: #ffe7a8; stroke: #1e140b; }
  .band { font: 700 17px "Trebuchet MS", sans-serif; letter-spacing: .06em; fill: #fff8e6; paint-order: stroke; stroke: #1e140b; stroke-width: 5px; stroke-linejoin: round; }
  .lamp { fill: #7d7d7d; stroke: #2b1a0e; stroke-width: 4; transition: fill .3s; }
  .lamp.on { fill: #43d343; filter: drop-shadow(0 0 10px #7dff7d); }
  .lamp.bad { fill: #e53935; filter: drop-shadow(0 0 10px #ff8a80); }
  .lamptxt { font: 700 15px "Trebuchet MS", sans-serif; fill: #2b1a0e; paint-order: stroke; stroke: #fff8e6; stroke-width: 4px; }
  .cloud { animation: drift 70s linear infinite; }
  @keyframes drift { from { transform: translateX(-260px); } to { transform: translateX(1800px); } }
  .flag { animation: wave 1.3s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
  @keyframes wave { 50% { transform: skewY(12deg); } }
  .flame { animation: flick .35s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center bottom; }
  @keyframes flick { to { transform: scaleY(1.25) scaleX(.9); } }
  .water { animation: bob 2.4s ease-in-out infinite alternate; }
  @keyframes bob { to { transform: translateY(3px); } }
  #pop text { font: 700 18px "Trebuchet MS", sans-serif; fill: #2b1a0e; }
  #tok .bob { animation: hop .5s ease-in-out infinite alternate; }
  @keyframes hop { to { transform: translateY(-4px); } }
</style>

<script>
const NS = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);
function mk(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

// battlements and ladder rungs
for (let x = 232; x < 590; x += 46) mk("rect", { x, y: 392, width: 28, height: 30 }, $("bat1"));
for (let x = 602; x < 650; x += 40) mk("rect", { x, y: 622, width: 26, height: 30 }, $("bat2"));
for (let x = 1060; x < 1100; x += 40) mk("rect", { x, y: 622, width: 26, height: 30 }, $("bat2"));
for (let y = 190; y < 690; y += 20) mk("line", { x1: 1018, y1: y, x2: 1038, y2: y }, $("rungsUp"));
for (let y = 872; y < 1222; y += 20) mk("line", { x1: 1062, y1: y, x2: 1084, y2: y }, $("rungsDown"));

// labels: id, x, y, name, files[], anchor, white
const L = [
  ["nimal", 14, 722, "Nimal", ["the customer"]],
  ["gatekeeper", 296, 716, "Gatekeeper", ["VisitController"]],
  ["letterIn", 266, 512, "Letter in", ["VisitRequest"]],
  ["replyScroll", 436, 512, "Reply scroll", ["VisitResponse"]],
  ["stopGuard", 574, 690, "Stop guard", ["VisitExceptionHandler"], "end"],
  ["steward", 626, 722, "Steward", ["UseCaseConfig"]],
  ["saveClerk", 762, 722, "Save clerk", ["SaveVisit"]],
  ["finder", 876, 722, "Finder", ["GetVisit"]],
  ["chest", 928, 766, "Promise chest", ["VisitRepository"]],
  ["book", 678, 214, "Rule book", ["Visit.java"]],
  ["idMachine", 686, 376, "ID machine", ["makes a new id"]],
  ["scissors", 800, 376, "Scissors", ["trim spaces"]],
  ["sealPress", 690, 530, "Wax seal", ["VisitStatus = STORED"]],
  ["tornBin", 868, 530, "Torn-paper bin", ["InvalidVisit"]],
  ["archivist", 636, 1090, "Archivist", ["PostgresVisitRepository"], "start", 1],
  ["card", 706, 1142, "Drawer card", ["VisitEntity"], "start", 1],
  ["key", 700, 985, "Cabinet key", ["VisitJpaRepository"], "start", 1],
  ["cabinet", 880, 1036, "Drawer cabinet", ["PostgreSQL table: visits"], "start", 1],
  ["wagon", 36, 1070, "Supply wagon", ["pom.xml"]],
  ["sign", 214, 1070, "Address sign", ["application.yml"]],
  ["crane", 372, 1070, "Builder's crane", ["docker-compose.yml"]],
  ["torch", 530, 322, "Torch", ["VisitApiApplication"], "end"],
  ["bell", 1134, 330, "Empty bell", ["Kafka · built later"], "start", 1],
  ["map", 1356, 690, "Practice map", ["test application.yml"]],
  ["dummy", 1540, 690, "Straw dummy", ["VisitTest"]],
  ["fakeChest", 1360, 764, "Fake chest", ["SaveVisitTest", "GetVisitTest"]],
  ["drillGate", 1540, 764, "Drill gate", ["VisitControllerTest", "whole castle"]]
];
for (const [id, x, y, name, files, anchor, white] of L) {
  const g = $("o-" + id); const cls = white ? " w" : "";
  const t = mk("text", { class: "nm" + cls, x, y, "text-anchor": anchor || "start" }, g); t.textContent = name;
  files.forEach((f, i) => { const s = mk("text", { class: "fl" + cls, x, y: y + 17 + i * 15, "text-anchor": anchor || "start" }, g); s.textContent = f; });
}
["wagon","sign","crane"].forEach(()=>{});

// ============ INFO ============
const INFO = {
  nimal: ["Nimal, the customer", "A person (or an app) that sends a letter to the castle. He wants a visit saved or found.", "Not in the code. He is the one who calls it."],
  torch: ["Torch · starts everything", "Light it and the castle wakes up. The program starts and listens on door 8080.", "visit-api/src/main/java/com/nextvisit/visitapi/VisitApiApplication.java"],
  wagon: ["Supply wagon", "Brings the supplies: Java 21, Spring Boot, the PostgreSQL driver, JUnit, Mockito.", "visit-api/pom.xml"],
  sign: ["Address sign", "Says: the castle door is 8080. The vault (PostgreSQL) is on 5432.", "visit-api/src/main/resources/application.yml"],
  crane: ["Builder's crane", "Builds the real vault on your PC. It starts PostgreSQL inside Docker.", "docker-compose.yml (project root)"],
  gatekeeper: ["Gatekeeper", "Stands at the only door. POST /visits saves. GET /visits/{id} finds. He reads the letter, calls the hall, sends the reply. He never checks rules and never touches the database.", "adapter/web/VisitController.java"],
  letterIn: ["Letter in", "The JSON paper that arrives: customer name, visit date, service type. It is only paper. It is not a visit yet.", "adapter/web/VisitRequest.java"],
  replyScroll: ["Reply scroll", "What goes back out: id, name, date, service, status. The gatekeeper turns the visit into this scroll.", "adapter/web/VisitResponse.java"],
  stopGuard: ["Stop guard", "Catches the torn paper (InvalidVisit) and shouts HTTP 400 with the reason.", "adapter/web/VisitExceptionHandler.java"],
  steward: ["Steward", "When the castle opens, he puts each clerk at a desk and hands each one the promise chest.", "config/UseCaseConfig.java"],
  saveClerk: ["Save clerk", "One job: save. Asks the book to make a Visit, then asks the chest to keep it. Gives the same Visit back.", "application/SaveVisit.java"],
  finder: ["Finder with lantern", "One job: find a visit by id. Asks the chest. Gives back the visit, or nothing.", "application/GetVisit.java"],
  chest: ["Promise chest", "An empty chest with a label. It only promises: save(visit) and findById(id). It is not the vault.", "application/port/VisitRepository.java"],
  book: ["Rule book + three lamps", "Visit.create checks three things in order: name, date, service. Each lamp turns green. If one is missing, the paper is torn and no lamp for it turns on.", "domain/Visit.java"],
  idMachine: ["ID machine", "After the checks pass, it prints a brand new random id (UUID) for the visit.", "domain/Visit.java (UUID.randomUUID)"],
  scissors: ["Scissors", "Trims extra spaces from the name and the service. ' Nimal ' becomes 'Nimal'.", "domain/Visit.java (trim)"],
  sealPress: ["Wax seal press", "Stamps the status STORED on the visit. Now it is a real Visit.", "domain/VisitStatus.java"],
  tornBin: ["Torn-paper bin", "Where bad papers end up. The book throws InvalidVisit with a plain reason, like 'Service type is required'.", "domain/InvalidVisit.java"],
  archivist: ["Archivist", "Keeps the chest's promise. Turns a Visit into a drawer card to save. Turns a card back into a Visit to find.", "adapter/persistence/PostgresVisitRepository.java"],
  card: ["Drawer card", "The shape of one row in the visits table. This is the 'card' coat.", "adapter/persistence/VisitEntity.java"],
  key: ["Cabinet key", "Spring's ready-made key to the visits table. It can save a card and find a card by id.", "adapter/persistence/VisitJpaRepository.java"],
  cabinet: ["Drawer cabinet = PostgreSQL", "The real vault. Visits live here as rows. Only the archivist walks in.", "PostgreSQL database: nextvisit, table: visits"],
  bell: ["Empty bell", "Not built yet. Later, Kafka will ring this bell after a save: 'a visit was saved'. Today it is silent.", "Not in the code yet"],
  map: ["Practice map", "Drills use a temporary memory database (H2) that behaves like PostgreSQL. The real vault stays shut.", "src/test/resources/application.yml"],
  dummy: ["Straw dummy", "Hits the rule book alone. Good letter, blank name, no date. This is a JUnit test.", "src/test/.../domain/VisitTest.java"],
  fakeChest: ["Fake chest", "A pretend promise chest made by Mockito. Lets the clerks be tested without any vault.", "SaveVisitTest.java, GetVisitTest.java"],
  drillGate: ["Drill gate", "Walks the whole castle: POST, then GET. A blank service must get 400.", "src/test/.../adapter/web/VisitControllerTest.java"]
};
function showInfo(id) {
  const o = INFO[id]; if (!o) return;
  $("card").innerHTML = "<h3>" + o[0] + "</h3><p>" + o[1] + "</p><p><span class='file'>" + o[2] + "</span></p>";
}

// ============ STORY ============
const P = { nimal: [110, 850], gate: [395, 850], clerk: [730, 850], chest: [935, 850], finder: [895, 850], guard: [450, 850], upBase: [1030, 850], downBase: [1074, 850] };
const KEEP = { A: 330, B: 490, C: 630 };
const toKeep = (floor, x) => { const ys = [KEEP.C, KEEP.B, KEEP.A]; const out = [[1030, 850]]; for (const y of ys) { out.push([1030, y]); if (y === KEEP[floor]) break; } out.push([x, KEEP[floor]]); return out; };
const keepDown = (fromFloor, toFloor, x) => { const order = ["A", "B", "C"]; const out = [[1030, KEEP[fromFloor]]]; let i = order.indexOf(fromFloor); while (order[i] !== toFloor) { i++; out.push([1030, KEEP[order[i]]]); } out.push([x, KEEP[toFloor]]); return out; };
const keepOut = (fromFloor, x) => { const order = ["A", "B", "C"]; const out = [[1030, KEEP[fromFloor]]]; let i = order.indexOf(fromFloor); while (i < 2) { i++; out.push([1030, KEEP[order[i]]]); } out.push([1030, 850]); out.push([x, 850]); return out; };
const toVault = (x) => [[1074, 850], [1074, 1215], [x, 1215]];
const fromVault = (x) => [[1074, 1215], [1074, 850], [x, 850]];

const COAT = { paper: ["t-paper", "PAPER", "#ffffff"], visit: ["t-visit", "VISIT", "#ffd54f"], card: ["t-card", "CARD", "#d9b98a"], scroll: ["t-scroll", "SCROLL", "#f4e3bf"], torn: ["t-torn", "TORN", "#ff8a80"], ask: ["t-ask", "ASK", "#81d4fa"], spark: ["t-spark", "GO", "#ffcc80"] };
const tok = $("tok"), pop = $("pop");
let mode = "save", idx = 0, playing = true, cur = [110, 850], anim = 0, timer = 0, lampTimers = [];

function place(x, y) { cur = [x, y]; tok.setAttribute("transform", "translate(" + (x - 24) + "," + (y - 56) + ")"); }
function setCoat(c) { const [shape, label, color] = COAT[c]; Object.values(COAT).forEach((v) => $(v[0]).style.display = "none"); $(shape).style.display = ""; $("pillTx").textContent = label; $("pillBg").setAttribute("fill", color); $("faceG").style.display = c === "spark" ? "none" : ""; }
function setLamps(state) {
  lampTimers.forEach(clearTimeout); lampTimers = [];
  const ids = ["lampN", "lampD", "lampS"];
  const reset = () => ids.forEach((i) => $(i).querySelector(".lamp").setAttribute("class", "lamp"));
  if (state === "off") { reset(); return; }
  if (!state) return;
  reset();
  state.forEach((s, i) => lampTimers.push(setTimeout(() => $(ids[i]).querySelector(".lamp").setAttribute("class", "lamp " + s), 500 + i * 700)));
}
function showPop(lines) {
  pop.innerHTML = ""; pop.style.display = "";
  const w = Math.max(...lines.map((l) => l.length)) * 9.6 + 28, h = lines.length * 24 + 16;
  let x = Math.min(1690 - w / 2, Math.max(10 + w / 2, cur[0])), y = cur[1] - 96 - h; let below = false;
  if (y < 6) { y = cur[1] + 18; below = true; }
  mk("rect", { x: x - w / 2, y, width: w, height: h, rx: 14, fill: "#fffdf2", stroke: "#2b1a0e", "stroke-width": 4 }, pop);
  const tx = Math.min(x + w / 2 - 14, Math.max(x - w / 2 + 14, cur[0]));
  if (!below) mk("path", { d: "M" + (tx - 10) + " " + (y + h - 1) + " L" + tx + " " + (y + h + 14) + " L" + (tx + 10) + " " + (y + h - 1) + " Z", fill: "#fffdf2", stroke: "#2b1a0e", "stroke-width": 4, "stroke-linejoin": "round" }, pop);
  lines.forEach((l, i) => { const t = mk("text", { x, y: y + 29 + i * 24, "text-anchor": "middle" }, pop); t.textContent = l; });
}
function walk(pts, done) {
  cancelAnimationFrame(anim);
  const all = [cur].concat(pts), lens = []; let total = 0;
  for (let i = 1; i < all.length; i++) { const l = Math.hypot(all[i][0] - all[i - 1][0], all[i][1] - all[i - 1][1]); lens.push(l); total += l; }
  if (total < 1) { done(); return; }
  const dur = Math.max(800, total * 2.6), t0 = performance.now();
  (function frame(now) {
    const t = Math.min(1, (now - t0) / dur); let d = t * total, i = 0;
    while (i < lens.length - 1 && d > lens[i]) { d -= lens[i]; i++; }
    const f = lens[i] ? Math.min(1, d / lens[i]) : 1;
    place(all[i][0] + (all[i + 1][0] - all[i][0]) * f, all[i][1] + (all[i + 1][1] - all[i][1]) * f);
    if (t < 1) anim = requestAnimationFrame(frame); else done();
  })(performance.now());
}
function show(i) {
  clearTimeout(timer); cancelAnimationFrame(anim);
  const steps = MODES[mode]; idx = (i + steps.length) % steps.length; const s = steps[idx];
  pop.style.display = "none";
  document.querySelectorAll(".obj").forEach((o) => o.classList.toggle("lit", s.hi.includes(o.dataset.id)));
  setCoat(s.coat);
  $("count").textContent = "Step " + (idx + 1) + " of " + steps.length;
  $("title").textContent = s.title; $("text").textContent = s.text;
  $("prog").style.width = ((idx + 1) / steps.length * 100) + "%";
  showInfo(s.hi[0]);
  if (s.at) place(s.at[0], s.at[1]);
  const arrive = () => { showPop(s.pop); if (s.lamps) setLamps(s.lamps); if (playing) timer = setTimeout(() => show(idx + 1), 4200); };
  if (s.lamps === "off") setLamps("off");
  if (s.to) walk(s.to, arrive); else arrive();
}
document.querySelectorAll(".obj").forEach((o) => o.addEventListener("click", () => {
  document.querySelectorAll(".obj").forEach((x) => x.classList.remove("lit")); o.classList.add("lit"); showInfo(o.dataset.id);
}));
$("next").onclick = () => show(idx + 1);
$("back").onclick = () => show(idx - 1);
$("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "Pause" : "Play"; if (playing) show(idx + 1); else clearTimeout(timer); };
document.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => {
  mode = b.dataset.mode; document.querySelectorAll("[data-mode]").forEach((x) => x.classList.toggle("on", x === b)); show(0);
}));
show(0);
</script>

server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/nextvisit
    username: nextvisit
    password: nextvisit
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

nextvisit:
  kafka:
    enabled: true
